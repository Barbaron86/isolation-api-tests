x-base-service: &base-service
  image: base-service
  volumes:
    - .:/app
  working_dir: /app
  environment: &base-environment
    ENV_FILE: .env

x-python-service: &python-service
  <<: *base-service
  entrypoint: [ "python", "-u", "-m" ]

services:
  # kafka
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    ports: [ "9092:9092", "9093:9093" ]
    depends_on: [ "zookeeper" ]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:9093
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: [ "CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    container_name: kafka


  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    container_name: zookeeper

  # postgres
  postgres:
    image: postgres:15
    ports: [ "5432:5432" ]
    restart: always
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U root
      interval: 5s
      timeout: 3s
      retries: 5
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
    container_name: postgres

  postgres-init:
    image: postgres:15
    volumes:
      - ./scripts:/scripts
      - ./migrations/postgres:/docker-entrypoint-initdb.d
    command: [ "bash", "-o", "pipefail", "-c", "tr -d '\\r' < /scripts/postgres.sh | bash" ]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: root
    container_name: postgres-init


  postgres-migrator-operations:
    <<: *base-service
    command: [ "alembic", "-c", "services/operations/alembic.ini", "upgrade", "head" ]
    depends_on:
      postgres:
        condition: service_healthy
      postgres-init:
        condition: service_completed_successfully
    container_name: "postgres-migrator-operations"


  # mock -service
  redis:
    image: redis:7.4.12-alpine
    command: [ "redis-server", "--save", "", "--appendonly", "no" ]
    tmpfs: [ "/data" ]
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 2s
      timeout: 2s
      retries: 15

  http-mock:
    <<: *python-service
    ports: [ "127.0.0.1:8003:8003" ]
    command: [ "tests.mock.http.server", "--dynamic-scenarios" ]
    environment:
      <<: *base-environment
      MOCK_REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    container_name: "http-mock"

  grpc-mock:
    <<: *python-service
    ports: [ "9003:9003" ]
    command: "tests.mock.grpc.server"
    container_name: "grpc-mock"

  # gateway-services
  http-gateway:
    <<: *python-service
    ports: [ "8001:8001" ]
    command: "services.gateway.server.http"
    container_name: "http-gateway"

  grpc-gateway:
    <<: *python-service
    ports: [ "9001:9001" ]
    command: "services.gateway.server.grpc"
    container_name: "grpc-gateway"

  # operations-service
  http-operations:
    <<: *python-service
    ports: [ "8002:8002" ]
    command: "services.operations.server.http"
    depends_on:
      postgres-migrator-operations:
        condition: service_completed_successfully
    container_name: "http-operations"

  grpc-operations:
    <<: *python-service
    ports: [ "9002:9002" ]
    command: "services.operations.server.grpc"
    depends_on:
      postgres-migrator-operations:
        condition: service_completed_successfully
    container_name: "grpc-operations"

  kafka-operations:
    <<: *python-service
    command: "services.operations.server.kafka"
    depends_on:
      kafka:
        condition: service_healthy
      postgres-migrator-operations:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD", "python", "-c", "from pathlib import Path; raise SystemExit(not Path('/tmp/operations-kafka.ready').is_file())" ]
      interval: 2s
      timeout: 3s
      retries: 35
      start_period: 5s
    container_name: "kafka-operations"

volumes:
  pgdata:
