name: Isolation Tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  run-tests:
    runs-on: ubuntu-latest

    timeout-minutes: 30

    env:
      TEST_MARKER: regression
      TEST_COMPOSE_FILE: docker-compose.ci.yaml

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build base Docker image
        run: docker build -t base-service .

      - name: Start test services
        run: docker compose -f "$TEST_COMPOSE_FILE" up -d --build

      # Тесты выполняются на runner, контейнеры содержат только стенд.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Wait for test stand readiness
        run: python scripts/wait_for_stand.py --compose-file "$TEST_COMPOSE_FILE" --timeout 180

      # Метаданные собираются в среде тестов и передаются вместе с allure-results.
      - name: Write Allure environment
        run: python scripts/write_allure_environment.py

      - name: Run isolation tests
        run: python -m pytest -m "$TEST_MARKER" --alluredir=./allure-results

      - name: Collect test stand diagnostics
        if: always()
        continue-on-error: true
        run: python scripts/collect_stand_diagnostics.py --compose-file "$TEST_COMPOSE_FILE"

      - name: Upload test stand diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: stand-diagnostics
          path: |
            stand-diagnostics/state.json
            stand-diagnostics/collection.txt
          retention-days: 3
          if-no-files-found: warn

      # Тома одноразового CI-стенда удаляются после запуска.
      - name: Stop test services
        if: always()
        run: docker compose -f "$TEST_COMPOSE_FILE" down -v

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: allure-results
          path: allure-results

  publish-report:
    if: always()

    needs: [ run-tests ]

    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: gh-pages
          path: gh-pages

      - name: Download Allure results
        uses: actions/download-artifact@v6
        with:
          name: allure-results
          path: allure-results

      - name: Generate Allure Report with history
        uses: simple-elf/allure-report-action@v1.15
        with:
          allure_results: allure-results
          allure_history: allure-history

      - name: Verify generated Allure report
        shell: bash
        run: |
          test -s allure-report/index.html
          test -s "allure-history/${GITHUB_RUN_NUMBER}/index.html"

      - name: Deploy report to Github Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
